  <text x="526.2" y="282.6" font-size="12.5" text-anchor="start" font-weight="600" fill="#1a1a1a">Recursion</text>
  <circle cx="398.0" cy="404.0" r="8.0" fill="#E69F00" fill-opacity="0.85" stroke="#E69F00" stroke-width="1.5"/>
  <text x="411.0" y="408.0" font-size="12.5" text-anchor="start" font-weight="600" fill="#1a1a1a">晶泰科技</text>
