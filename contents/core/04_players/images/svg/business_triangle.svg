  <rect width="860" height="600" fill="#ffffff"/>
  <text x="430.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">三种商业模式的权衡</text>
  <polygon points="430.0,140.0 110.0,470.0 750.0,470.0" fill="#7a7a7a" fill-opacity="0.05" stroke="#7a7a7a" stroke-width="1.3"/>
  <text x="430.0" y="92.0" font-size="14" text-anchor="middle" font-weight="700" fill="#1a1a1a">自研管线</text>
  <text x="430.0" y="112.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444">上限最高 · 资本需求最大 · 承担全部临床风险</text>
  <text x="110.0" y="504.0" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">技术服务（CRO 式）</text>
  <text x="110.0" y="524.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#444">现金流稳 · 天花板低 · 易被药企自建替代</text>
  <text x="750.0" y="504.0" font-size="14" text-anchor="end" font-weight="700" fill="#1a1a1a">平台合作（里程碑 + 分成）</text>
  <text x="750.0" y="524.0" font-size="11.5" text-anchor="end" font-weight="400" fill="#444">分享成功收益 · 价值依赖合作方决策</text>
