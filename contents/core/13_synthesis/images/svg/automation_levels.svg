  <rect width="1020" height="400" fill="#ffffff"/>
  <text x="510.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">实验室自动化的四个层级</text>
  <rect x="20.0" y="70.0" width="232.0" height="110.0" rx="6" ry="6" fill="#bdbdbd" fill-opacity="0.16" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="136.0" y="120.4" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">L1 辅助</text>
  <text x="136.0" y="139.4" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">人工操作 + 电子记录本</text>
  <rect x="40.0" y="200.0" width="192.0" height="44.0" rx="6" ry="6" fill="#bdbdbd" fill-opacity="0.08" stroke="#bdbdbd" stroke-width="1.5"/>
  <text x="136.0" y="225.6" font-size="12" text-anchor="middle" font-weight="600" fill="#1a1a1a">数据可追溯</text>
  <line x1="252.0" y1="125.0" x2="270.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar-black)"/>
  <rect x="270.0" y="70.0" width="232.0" height="110.0" rx="6" ry="6" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="386.0" y="120.4" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">L2 自动化单元</text>
  <text x="386.0" y="139.4" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">自动加样、平行合成、自动纯化</text>
  <rect x="290.0" y="200.0" width="192.0" height="44.0" rx="6" ry="6" fill="#56B4E9" fill-opacity="0.08" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="386.0" y="225.6" font-size="12" text-anchor="middle" font-weight="600" fill="#1a1a1a">单步通量提升</text>
  <line x1="502.0" y1="125.0" x2="520.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar-black)"/>
  <rect x="520.0" y="70.0" width="232.0" height="110.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
  <text x="636.0" y="120.4" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">L3 流程自动化</text>
  <text x="636.0" y="139.4" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">合成—纯化—分析串联，人工调度</text>
  <rect x="540.0" y="200.0" width="192.0" height="44.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.08" stroke="#0072B2" stroke-width="1.5"/>
  <text x="636.0" y="225.6" font-size="12" text-anchor="middle" font-weight="600" fill="#1a1a1a">标准化数据</text>
  <line x1="752.0" y1="125.0" x2="770.0" y2="125.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar-black)"/>
  <rect x="770.0" y="70.0" width="232.0" height="110.0" rx="6" ry="6" fill="#A51C30" fill-opacity="0.16" stroke="#A51C30" stroke-width="1.5"/>
  <text x="886.0" y="120.4" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">L4 自驱动闭环</text>
  <text x="886.0" y="139.4" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">AI 决定下一批实验，机器人执行</text>
  <rect x="790.0" y="200.0" width="192.0" height="44.0" rx="6" ry="6" fill="#A51C30" fill-opacity="0.08" stroke="#A51C30" stroke-width="1.5"/>
  <text x="886.0" y="225.6" font-size="12" text-anchor="middle" font-weight="600" fill="#1a1a1a">真正的 DMTA 闭环</text>
  <text x="20.0" y="296.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">2026 年的产业现实：多数企业处于 L2–L3；完全无人干预的 L4 闭环仍然罕见，</text>
  <text x="20.0" y="322.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">瓶颈往往不在合成，而在分析与生物活性测试的自动化程度。</text>
  <text x="20.0" y="358.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#666">晶泰科技公开称其实验室有 300 余台机器人、50 万条实验记录，其中约 80% 为阴性样本。</text>
