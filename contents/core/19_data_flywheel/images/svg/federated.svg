  <rect width="1040" height="470" fill="#ffffff"/>
  <text x="520.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">联邦学习：模型动，数据不动</text>
  <rect x="60.0" y="70.0" width="260.0" height="88.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.13" stroke="#0072B2" stroke-width="1.5"/>
  <text x="190.0" y="109.5" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">药企 A</text>
  <text x="190.0" y="127.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">本地数据不出防火墙</text>
  <line x1="190.0" y1="158.0" x2="190.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ar-black)"/>
  <text x="200.0" y="186.0" font-size="11" text-anchor="start" font-weight="400" fill="#555">只上传模型更新</text>
  <rect x="380.0" y="70.0" width="260.0" height="88.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.13" stroke="#0072B2" stroke-width="1.5"/>
