  <line x1="510.0" y1="158.0" x2="510.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ar-black)"/>
  <text x="520.0" y="186.0" font-size="11" text-anchor="start" font-weight="400" fill="#555">只上传模型更新</text>
  <rect x="700.0" y="70.0" width="260.0" height="88.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.13" stroke="#0072B2" stroke-width="1.5"/>
  <text x="830.0" y="109.5" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">药企 C</text>
  <text x="830.0" y="127.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">本地数据不出防火墙</text>
  <line x1="830.0" y1="158.0" x2="830.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ar-black)"/>
  <text x="840.0" y="186.0" font-size="11" text-anchor="start" font-weight="400" fill="#555">只上传模型更新</text>
  <rect x="60.0" y="212.0" width="920.0" height="56.0" rx="6" ry="6" fill="#CC79A7" fill-opacity="0.14" stroke="#CC79A7" stroke-width="1.5"/>
  <text x="520.0" y="236.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#CC79A7">聚合服务器：合并各方的模型更新，不接触任何原始数据</text>
  <text x="520.0" y="256.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#555">回传合并后的全局模型</text>
  <rect x="60.0" y="300.0" width="180.0" height="44.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.16" stroke="#009E73" stroke-width="1.5"/>
  <text x="150.0" y="325.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">解决了什么</text>
  <text x="262.0" y="328.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">在数据不能出域的前提下，让多方共同训练出比各自单独训练更好的模型</text>
  <rect x="60.0" y="354.0" width="180.0" height="44.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.16" stroke="#E69F00" stroke-width="1.5"/>
  <text x="150.0" y="379.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">没解决什么</text>
  <text x="262.0" y="382.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">参与方的数据口径、测定方法与化学空间差异仍然存在，合并不会自动对齐</text>
  <rect x="60.0" y="408.0" width="180.0" height="44.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.16" stroke="#D55E00" stroke-width="1.5"/>
  <text x="150.0" y="433.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">真正的障碍</text>
  <text x="262.0" y="436.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">通常不是技术，而是激励：数据多的一方从共享中获益最少</text>
</svg>