  <rect width="1020" height="470" fill="#ffffff"/>
  <text x="510.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">AI 参与的发明：三个相互独立的问题</text>
  <rect x="24.0" y="66.0" width="230.0" height="98.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.17" stroke="#0072B2" stroke-width="1.5"/>
  <text x="139.0" y="119.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">谁是发明人？</text>
  <text x="278.0" y="100.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">多数法域要求发明人必须是自然人；AI 不能被列为发明人</text>
  <text x="278.0" y="134.0" font-size="12" text-anchor="start" font-weight="600" fill="#0072B2">判例已较为明确：DABUS 系列案在美、英、欧均被驳回</text>
  <rect x="24.0" y="184.0" width="230.0" height="98.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.17" stroke="#009E73" stroke-width="1.5"/>
  <text x="139.0" y="237.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">发明能否获得专利？</text>
  <text x="278.0" y="218.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">AI 参与不影响可专利性，关键看人类是否做出了实质性贡献</text>
  <text x="278.0" y="252.0" font-size="12" text-anchor="start" font-weight="600" fill="#009E73">USPTO 2024 年指引：需识别出对权利要求有实质贡献的自然人</text>
  <rect x="24.0" y="302.0" width="230.0" height="98.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.17" stroke="#E69F00" stroke-width="1.5"/>
  <text x="139.0" y="355.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">权利归谁所有？</text>
  <text x="278.0" y="336.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">由雇佣关系与合同约定决定，与 AI 是否参与无关</text>
  <text x="278.0" y="370.0" font-size="12" text-anchor="start" font-weight="600" fill="#E69F00">实践要点：平台方与药企的合作协议须事先约定归属</text>
  <rect x="24.0" y="424.0" width="972.0" height="36.0" rx="5" ry="5" fill="#A51C30" fill-opacity="0.1" stroke="#A51C30" stroke-width="1.5"/>
  <text x="510.0" y="447.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#A51C30">混淆这三个问题，是 AI 制药合作谈判中最常见的法律误区</text>
</svg>