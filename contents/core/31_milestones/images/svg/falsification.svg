  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">本书的核心判断及其否证条件</text>
  <rect x="24.0" y="66.0" width="270.0" height="66.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.17" stroke="#009E73" stroke-width="1.5"/>
  <text x="159.0" y="103.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">前端提效是真实的</text>
  <text x="318.0" y="106.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">若到 2029 年仍无企业能给出带基线的周期缩短数据，此判断应被怀疑</text>
  <rect x="24.0" y="148.0" width="270.0" height="66.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.17" stroke="#E69F00" stroke-width="1.5"/>
  <text x="159.0" y="185.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">后端瓶颈不随算力放松</text>
  <text x="318.0" y="188.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">若某个疾病领域在 2030 年前出现成功率的数量级跃升，此判断需修正</text>
  <rect x="24.0" y="230.0" width="270.0" height="66.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.17" stroke="#0072B2" stroke-width="1.5"/>
  <text x="159.0" y="267.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">评测缺口是核心障碍</text>
  <text x="318.0" y="270.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">若按时间划分的产业基准建立后，方法间差距仍如现在的报告所示，此判断不成立</text>
  <rect x="24.0" y="312.0" width="270.0" height="66.0" rx="6" ry="6" fill="#CC79A7" fill-opacity="0.17" stroke="#CC79A7" stroke-width="1.5"/>
  <text x="159.0" y="349.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">数据的方向性偏差难以消除</text>
  <text x="318.0" y="352.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">若出现能在长尾靶点上稳定有效的方法，此判断应被修正</text>
  <text x="24.0" y="406.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#A51C30">一个不能被否证的判断不是判断，是立场。</text>
</svg>