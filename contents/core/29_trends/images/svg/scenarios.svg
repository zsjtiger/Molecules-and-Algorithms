  <rect width="1050" height="420" fill="#ffffff"/>
  <text x="525.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">三种情景：区别在后端而非前端</text>
  <rect x="20.0" y="66.0" width="320.0" height="46.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="1.5"/>
  <text x="180.0" y="93.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">渐进情景（最可能）</text>
  <rect x="28.0" y="126.0" width="304.0" height="62.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.08" stroke="#0072B2" stroke-width="1.5"/>
  <text x="180.0" y="160.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">前端环节持续提效，周期与成本改善明确</text>
  <rect x="28.0" y="198.0" width="304.0" height="62.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.08" stroke="#0072B2" stroke-width="1.5"/>
  <text x="180.0" y="232.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">临床成功率小幅提升，统计上需十年才能确认</text>
  <rect x="28.0" y="270.0" width="304.0" height="62.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.08" stroke="#0072B2" stroke-width="1.5"/>
  <text x="180.0" y="304.4" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">行业结构：与传统药企深度融合，不再单列</text>
  <rect x="362.0" y="66.0" width="320.0" height="46.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.18" stroke="#009E73" stroke-width="1.5"/>
  <text x="522.0" y="93.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">加速情景</text>
  <rect x="370.0" y="126.0" width="304.0" height="62.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.08" stroke="#009E73" stroke-width="1.5"/>
  <text x="522.0" y="160.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">自动化与统一模型使飞轮周期缩短一个数量级</text>
  <rect x="370.0" y="198.0" width="304.0" height="62.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.08" stroke="#009E73" stroke-width="1.5"/>
  <text x="522.0" y="232.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">在少数机制清晰的疾病领域出现成功率跃升</text>
  <rect x="370.0" y="270.0" width="304.0" height="62.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.08" stroke="#009E73" stroke-width="1.5"/>
  <text x="522.0" y="304.4" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">行业结构：出现若干以平台为核心的新型大药企</text>
  <rect x="704.0" y="66.0" width="320.0" height="46.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.18" stroke="#D55E00" stroke-width="1.5"/>
  <text x="864.0" y="93.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">停滞情景</text>
  <rect x="712.0" y="126.0" width="304.0" height="62.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.08" stroke="#D55E00" stroke-width="1.5"/>
  <text x="864.0" y="160.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">前端提效的收益被后端失败吞没</text>
  <rect x="712.0" y="198.0" width="304.0" height="62.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.08" stroke="#D55E00" stroke-width="1.5"/>
  <text x="864.0" y="232.5" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">资本退潮，自研管线被迫转为服务</text>
  <rect x="712.0" y="270.0" width="304.0" height="62.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.08" stroke="#D55E00" stroke-width="1.5"/>
  <text x="864.0" y="304.4" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a1a1a">行业结构：AI 退回为常规工具，不再是叙事中心</text>
  <rect x="20.0" y="356.0" width="980.0" height="44.0" rx="6" ry="6" fill="#CC79A7" fill-opacity="0.1" stroke="#CC79A7" stroke-width="1.5"/>
  <text x="510.0" y="384.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#CC79A7">三种情景在 2030 年前的前端表现相似，区分它们的是后端的临床数据</text>
