  <rect width="1060" height="540" fill="#ffffff"/>
  <text x="530.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">虚拟筛选级联：逐级收窄，逐级变贵</text>
  <rect x="40.0" y="60.0" width="620.0" height="62.0" rx="6" ry="6" fill="#7a7a7a" fill-opacity="0.16" stroke="#7a7a7a" stroke-width="1.5"/>
  <text x="350.0" y="95.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">化合物库</text>
  <text x="690.0" y="86.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#7a7a7a">100 万 – 100 亿 个分子</text>
  <text x="690.0" y="108.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">枚举库或按需合成库</text>
  <line x1="350.0" y1="122.0" x2="350.0" y2="132.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ar-black)"/>
  <rect x="74.0" y="132.0" width="551.0" height="62.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
  <text x="349.5" y="167.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">规则与药效团过滤</text>
  <text x="690.0" y="158.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#0072B2">10 万 – 1000 万 个分子</text>
  <text x="690.0" y="180.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">理化性质、子结构、形状匹配</text>
  <line x1="350.0" y1="194.0" x2="350.0" y2="204.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ar-black)"/>
  <rect x="108.0" y="204.0" width="483.0" height="62.0" rx="6" ry="6" fill="#56B4E9" fill-opacity="0.16" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="349.5" y="239.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">分子对接</text>
  <text x="690.0" y="230.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#56B4E9">1000 – 10 万 个分子</text>
  <text x="690.0" y="252.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">刚性受体打分，速度优先</text>
  <line x1="350.0" y1="266.0" x2="350.0" y2="276.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ar-black)"/>
  <rect x="142.0" y="276.0" width="415.0" height="62.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.16" stroke="#009E73" stroke-width="1.5"/>
  <text x="349.5" y="311.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">重打分 / MM-GBSA</text>
  <text x="690.0" y="302.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#009E73">100 – 1000 个分子</text>
  <text x="690.0" y="324.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">引入溶剂化与柔性，中等精度</text>
  <line x1="350.0" y1="338.0" x2="350.0" y2="348.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ar-black)"/>
  <rect x="176.0" y="348.0" width="347.0" height="62.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.16" stroke="#E69F00" stroke-width="1.5"/>
  <text x="349.5" y="383.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">自由能微扰（FEP）</text>
  <text x="690.0" y="374.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#E69F00">10 – 100 个分子</text>
  <text x="690.0" y="396.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">物理最严格，算力最贵</text>
  <line x1="350.0" y1="410.0" x2="350.0" y2="420.0" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#ar-black)"/>
  <rect x="210.0" y="420.0" width="279.0" height="62.0" rx="6" ry="6" fill="#A51C30" fill-opacity="0.16" stroke="#A51C30" stroke-width="1.5"/>
  <text x="349.5" y="455.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">实验测定</text>
  <text x="690.0" y="446.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#A51C30">5 – 50 个分子</text>
  <text x="690.0" y="468.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">唯一的事实来源</text>
  <text x="40.0" y="522.0" font-size="12" text-anchor="start" font-weight="600" fill="#444">每一级的任务不是选出最好的分子，而是在不丢掉真阳性的前提下尽量减少进入下一级的数量。</text>
</svg>