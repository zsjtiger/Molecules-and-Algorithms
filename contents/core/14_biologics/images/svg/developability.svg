  <text x="142.0" y="261.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">是否结合脱靶蛋白</text>
  <rect x="271.0" y="210.0" width="228.0" height="78.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
