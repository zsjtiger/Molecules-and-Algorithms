  <text x="628.0" y="261.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">高浓度下是否析出</text>
  <rect x="757.0" y="210.0" width="228.0" height="78.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="871.0" y="244.1" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">溶解度与黏度</text>
  <text x="871.0" y="261.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">能否做成皮下注射剂</text>
  <rect x="28.0" y="306.0" width="228.0" height="78.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="142.0" y="340.1" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">表达量</text>
  <text x="142.0" y="357.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">生产成本</text>
  <rect x="271.0" y="306.0" width="228.0" height="78.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="385.0" y="340.1" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">免疫原性</text>
  <text x="385.0" y="357.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">是否引发抗药抗体</text>
  <rect x="514.0" y="306.0" width="228.0" height="78.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="628.0" y="340.1" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">药代动力学</text>
  <text x="628.0" y="357.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">半衰期与给药频率</text>
  <rect x="757.0" y="306.0" width="228.0" height="78.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.12" stroke="#E69F00" stroke-width="1.5"/>
  <text x="871.0" y="340.1" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">易修饰位点</text>
  <text x="871.0" y="357.9" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">氧化、脱酰胺影响一致性</text>
  <text x="500.0" y="434.0" font-size="12.5" text-anchor="middle" font-weight="600" fill="#A51C30">AI 在这八项上的预测能力普遍弱于“能否结合”——这是生物药 AI 的下一个主战场</text>
