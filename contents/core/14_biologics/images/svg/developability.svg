  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">从“能结合”到“能成药”：瓶颈的转移</text>
  <rect x="60.0" y="80.0" width="300.0" height="80.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.16" stroke="#009E73" stroke-width="1.5"/>
