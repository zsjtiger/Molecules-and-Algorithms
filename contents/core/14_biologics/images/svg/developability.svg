  <text x="210.0" y="134.7" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">从头设计已取得突破：
Chai-2 迷你蛋白命中率 68%</text>
  <line x1="372.0" y1="120.0" x2="420.0" y2="120.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar-black)"/>
