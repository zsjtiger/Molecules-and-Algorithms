  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">抗体为什么特别难设计</text>
  <line x1="230.0" y1="300.0" x2="230.0" y2="230.0" stroke="#7a7a7a" stroke-width="14"/>
  <line x1="230.0" y1="232.0" x2="145.0" y2="130.0" stroke="#7a7a7a" stroke-width="14"/>
  <line x1="230.0" y1="232.0" x2="315.0" y2="130.0" stroke="#7a7a7a" stroke-width="14"/>
  <circle cx="145.0" cy="122.0" r="22.0" fill="#A51C30" fill-opacity="0.75" stroke="#A51C30" stroke-width="1.5"/>
  <circle cx="315.0" cy="122.0" r="22.0" fill="#A51C30" fill-opacity="0.75" stroke="#A51C30" stroke-width="1.5"/>
  <text x="230.0" y="330.0" font-size="13" text-anchor="middle" font-weight="600" fill="#1a1a1a">抗体（示意）</text>
  <text x="230.0" y="92.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#A51C30">CDR 区</text>
  <text x="230.0" y="360.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#555">重链 + 轻链各三个 CDR 环</text>
  <rect x="430.0" y="70.0" width="450.0" height="72.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.12" stroke="#0072B2" stroke-width="1.5"/>
  <text x="655.0" y="101.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">CDR 环高度可变</text>
  <text x="655.0" y="119.7" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">尤其 CDR-H3，长度和构象没有规律</text>
  <rect x="430.0" y="158.0" width="450.0" height="72.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.12" stroke="#0072B2" stroke-width="1.5"/>
  <text x="655.0" y="189.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">缺乏进化信息</text>
  <text x="655.0" y="207.7" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">抗体多样性来自体细胞重组而非进化，MSA 方法失效</text>
  <rect x="430.0" y="246.0" width="450.0" height="72.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.12" stroke="#0072B2" stroke-width="1.5"/>
  <text x="655.0" y="277.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">靠柔性环而非规则二级结构</text>
  <text x="655.0" y="295.7" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">普通结合蛋白设计依赖 α 螺旋 / β 折叠，原始 RFdiffusion 无法处理</text>
  <rect x="430.0" y="334.0" width="450.0" height="72.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.12" stroke="#0072B2" stroke-width="1.5"/>
  <text x="655.0" y="365.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">界面预测本身就难</text>
  <text x="655.0" y="383.7" font-size="11.5" text-anchor="middle" font-weight="400" fill="#444444">抗体–抗原复合物精度仍明显低于普通蛋白复合物</text>
</svg>