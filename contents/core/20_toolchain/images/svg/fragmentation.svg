  <text x="272.0" y="340.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">同一分子在各步骤得到不同的内部 ID，结果难以回溯</text>
  <rect x="20.0" y="370.0" width="230.0" height="46.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.13" stroke="#D55E00" stroke-width="1.5"/>
  <text x="135.0" y="396.6" font-size="12" text-anchor="middle" font-weight="600" fill="#1a1a1a">版本不可复现</text>
  <text x="272.0" y="398.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">工具版本与参数未记录，几个月后无法重跑同一结果</text>
  <text x="20.0" y="440.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#A51C30">每一次转换都是一个无声失败的机会：流程不会报错，只会给出错误的数字。</text>
