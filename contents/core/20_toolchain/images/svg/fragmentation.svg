  <text x="272.0" y="224.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">nM / μM / pIC50 混用，转换错误难以察觉</text>
  <rect x="20.0" y="254.0" width="230.0" height="46.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.13" stroke="#D55E00" stroke-width="1.5"/>
