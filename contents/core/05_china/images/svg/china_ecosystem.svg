  <text x="130.0" y="156.0" font-size="13.5" text-anchor="middle" font-weight="700" fill="#ffffff">资本</text>
  <text x="248.0" y="156.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">2026 前三季度 57 笔融资、近 158 亿元；红杉、高瓴等集中押注头部；港股 18C 通道</text>
  <rect x="30.0" y="188.0" width="1000.0" height="58.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.1" stroke="#0072B2" stroke-width="1.5"/>
