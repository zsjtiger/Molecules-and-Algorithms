  <text x="248.0" y="486.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">临床试验招募快、成本低；真实世界数据规模大但分散</text>
  <text x="30.0" y="540.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#444">出海通道：对外授权（license-out）、合资、海外临床；2026 年上半年中国创新药 BD 交易总额约 997 亿美元。</text>
