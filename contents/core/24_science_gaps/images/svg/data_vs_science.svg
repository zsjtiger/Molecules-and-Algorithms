  <rect width="1020" height="430" fill="#ffffff"/>
  <text x="510.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">科学瓶颈：哪些是数据问题，哪些不是</text>
