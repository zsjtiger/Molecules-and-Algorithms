  <rect x="24.0" y="310.0" width="470.0" height="52.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.08" stroke="#009E73" stroke-width="1.5"/>
  <text x="259.0" y="339.6" font-size="12" text-anchor="middle" font-weight="400" fill="#1a1a1a">文献与专利的证据汇总</text>
  <rect x="526.0" y="124.0" width="470.0" height="52.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.08" stroke="#D55E00" stroke-width="1.5"/>
