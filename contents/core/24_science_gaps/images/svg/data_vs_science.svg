  <rect x="526.0" y="186.0" width="470.0" height="52.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.08" stroke="#D55E00" stroke-width="1.5"/>
  <text x="761.0" y="215.6" font-size="12" text-anchor="middle" font-weight="400" fill="#1a1a1a">模型生物与人类的生物学差异</text>
  <rect x="526.0" y="248.0" width="470.0" height="52.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.08" stroke="#D55E00" stroke-width="1.5"/>
  <text x="761.0" y="277.6" font-size="12" text-anchor="middle" font-weight="400" fill="#1a1a1a">替代终点与临床结局的因果关系</text>
  <rect x="526.0" y="310.0" width="470.0" height="52.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.08" stroke="#D55E00" stroke-width="1.5"/>
  <text x="761.0" y="339.6" font-size="12" text-anchor="middle" font-weight="400" fill="#1a1a1a">人体内复杂系统的涌现行为</text>
  <text x="510.0" y="400.0" font-size="12.5" text-anchor="middle" font-weight="700" fill="#444">右栏的问题不是算力或样本量不足，而是人类尚未掌握相应的因果知识。</text>
  <text x="510.0" y="422.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555">AI 可以加速对这些问题的研究，但不能跳过研究本身。</text>
