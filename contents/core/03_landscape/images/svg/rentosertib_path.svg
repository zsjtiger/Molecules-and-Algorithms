  <text x="724.0" y="238.0" font-size="11.5" text-anchor="middle" font-weight="400" fill="#A51C30">临床结局预测（inClinico）辅助设计</text>
  <text x="22.0" y="300.0" font-size="10.5" text-anchor="start" font-weight="400" fill="#666">虚线框为尚未发生的阶段。II a 期数据来自《自然·医学》2025 年 6 月；III 期信息来自公司公告与登记记录（NCT07687459）。</text>
