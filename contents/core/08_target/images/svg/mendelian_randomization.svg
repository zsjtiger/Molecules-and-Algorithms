  <rect width="900" height="390" fill="#ffffff"/>
  <text x="450.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">孟德尔随机化：用遗传变异作为工具变量推断因果</text>
  <rect x="90.0" y="200.0" width="170.0" height="64.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.1" stroke="#009E73" stroke-width="1.5"/>
