  <text x="175.0" y="245.6" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">受孕时随机分配</text>
  <rect x="360.0" y="200.0" width="180.0" height="64.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.1" stroke="#0072B2" stroke-width="1.5"/>
  <text x="450.0" y="227.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">暴露 X</text>
  <text x="450.0" y="245.6" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">如某血浆蛋白水平</text>
  <rect x="650.0" y="200.0" width="180.0" height="64.0" rx="6" ry="6" fill="#A51C30" fill-opacity="0.1" stroke="#A51C30" stroke-width="1.5"/>
  <text x="740.0" y="227.4" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">结局 Y</text>
  <text x="740.0" y="245.6" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">疾病</text>
  <rect x="500.0" y="70.0" width="180.0" height="56.0" rx="6" ry="6" fill="#7a7a7a" fill-opacity="0.1" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="590.0" y="93.2" font-size="13" text-anchor="middle" font-weight="600" fill="#1a1a1a">混杂因素 U</text>
  <text x="590.0" y="111.3" font-size="11" text-anchor="middle" font-weight="400" fill="#444444">生活方式、环境…</text>
  <line x1="260.0" y1="232.0" x2="360.0" y2="232.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar-black)"/>
  <text x="310.0" y="222.0" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">① 相关性</text>
  <line x1="540.0" y1="232.0" x2="650.0" y2="232.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ar-black)"/>
  <text x="595.0" y="222.0" font-size="11.5" text-anchor="middle" font-weight="600" fill="#A51C30">待估因果效应</text>
  <line x1="560.0" y1="126.0" x2="470.0" y2="200.0" stroke="#7a7a7a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ar-gray)"/>
  <line x1="630.0" y1="126.0" x2="720.0" y2="200.0" stroke="#7a7a7a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ar-gray)"/>
  <text x="270.0" y="120.0" font-size="11.5" text-anchor="middle" font-weight="600" fill="#009E73">② 独立性：G 与 U 无关</text>
  <path d="M 175 264 C 260 330, 640 330, 740 266" fill="none" stroke="#D55E00" stroke-width="1.4" stroke-dasharray="2,3" marker-end="url(#ar-verm)"/>
  <text x="450.0" y="370.0" font-size="11.5" text-anchor="middle" font-weight="600" fill="#D55E00">③ 排他性：G 不能绕过 X 直接影响 Y（水平多效性会破坏这一点）</text>
