  <rect width="820" height="400" fill="#ffffff"/>
  <text x="410.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">科研智能体的四类失效模式与对应防护</text>
  <rect x="24.0" y="62.0" width="180.0" height="62.0" rx="6" ry="6" fill="#D55E00" fill-opacity="0.18" stroke="#D55E00" stroke-width="1.5"/>
  <text x="114.0" y="97.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">幻觉引用</text>
  <text x="224.0" y="88.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">编造不存在的文献、专利或实验结果</text>
  <text x="224.0" y="110.0" font-size="12" text-anchor="start" font-weight="600" fill="#D55E00">防护：强制检索增强：每条结论附可点击的原始链接</text>
  <rect x="24.0" y="142.0" width="180.0" height="62.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.18" stroke="#E69F00" stroke-width="1.5"/>
  <text x="114.0" y="177.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">偏向主流</text>
  <text x="224.0" y="168.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">复述文献中说得最多的观点，强化已知偏差</text>
  <text x="224.0" y="190.0" font-size="12" text-anchor="start" font-weight="600" fill="#E69F00">防护：显式要求列出反面证据与争议</text>
  <rect x="24.0" y="222.0" width="180.0" height="62.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="1.5"/>
  <text x="114.0" y="257.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">工具误用</text>
  <text x="224.0" y="248.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">调用了正确的工具但参数或解读错误</text>
  <text x="224.0" y="270.0" font-size="12" text-anchor="start" font-weight="600" fill="#0072B2">防护：工具输出做单位、量纲与范围的自动校验</text>
  <rect x="24.0" y="302.0" width="180.0" height="62.0" rx="6" ry="6" fill="#CC79A7" fill-opacity="0.18" stroke="#CC79A7" stroke-width="1.5"/>
  <text x="114.0" y="337.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">级联错误</text>
  <text x="224.0" y="328.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1a1a1a">多步推理中早期错误被后续步骤放大</text>
  <text x="224.0" y="350.0" font-size="12" text-anchor="start" font-weight="600" fill="#CC79A7">防护：每步设置可验证的中间检查点</text>
  <text x="24.0" y="388.0" font-size="12.5" text-anchor="start" font-weight="600" fill="#444">共同原则：智能体的输出是“待核查的线索”，不是“已验证的结论”。</text>
</svg>