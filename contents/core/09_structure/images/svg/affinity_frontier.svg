  <ellipse cx="440" cy="280" rx="95" ry="42" fill="#56B4E9" fill-opacity="0.18" stroke="#56B4E9" stroke-width="1.5"/>
  <text x="440.0" y="278.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a1a">MM/GBSA</text>
  <text x="440.0" y="296.0" font-size="11" text-anchor="middle" font-weight="400" fill="#444">中等成本 · 中低精度</text>
  <ellipse cx="720" cy="140" rx="115" ry="50" fill="#0072B2" fill-opacity="0.18" stroke="#0072B2" stroke-width="1.5"/>
  <text x="720.0" y="138.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a1a">FEP / RBFE</text>
  <text x="720.0" y="156.0" font-size="11" text-anchor="middle" font-weight="400" fill="#444">数小时 GPU · 约 1 kcal/mol</text>
  <ellipse cx="330" cy="150" rx="110" ry="50" fill="#A51C30" fill-opacity="0.18" stroke="#A51C30" stroke-width="1.5"/>
  <text x="330.0" y="148.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a1a">Boltz-2 等 AI 模型</text>
  <text x="330.0" y="166.0" font-size="11" text-anchor="middle" font-weight="400" fill="#444">FEP+ 基准 r ≈ 0.62，快 1000× 以上</text>
