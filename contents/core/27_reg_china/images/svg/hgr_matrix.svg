  <text x="488.0" y="232.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">外方单位实质性参与即触发</text>
  <rect x="24.0" y="266.0" width="290.0" height="56.0" rx="6" ry="6" fill="#A51C30" fill-opacity="0.14" stroke="#A51C30" stroke-width="1.5"/>
