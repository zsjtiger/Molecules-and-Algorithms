  <text x="399.0" y="433.8" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">事先报告 + 备份</text>
  <text x="488.0" y="436.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">已公开的信息不在此列</text>
  <text x="24.0" y="486.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#A51C30">判断起点是“外方单位是否实质性参与”，而非合作协议怎么写。</text>
