  <text x="488.0" y="300.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">指实物样本的出境</text>
  <rect x="24.0" y="334.0" width="290.0" height="56.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.14" stroke="#E69F00" stroke-width="1.5"/>
  <text x="169.0" y="365.8" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">国际合作临床试验</text>
