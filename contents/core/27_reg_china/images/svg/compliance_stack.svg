  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">中国数据合规的四层叠加：药企要同时满足</text>
  <rect x="24.0" y="70.0" width="400.0" height="66.0" rx="6" ry="6" fill="#A51C30" fill-opacity="0.16" stroke="#A51C30" stroke-width="1.5"/>
  <text x="224.0" y="107.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">《生物安全法》</text>
  <text x="448.0" y="110.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">上位法，确立生物安全与遗传资源的基本制度</text>
  <rect x="24.0" y="152.0" width="400.0" height="66.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.16" stroke="#E69F00" stroke-width="1.5"/>
  <text x="224.0" y="189.0" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">《人类遗传资源管理条例》及实施细则</text>
  <text x="448.0" y="192.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">采集、保藏、国际合作、出境与信息对外提供的具体规则</text>
  <rect x="24.0" y="234.0" width="400.0" height="66.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.16" stroke="#0072B2" stroke-width="1.5"/>
  <text x="224.0" y="271.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">《数据安全法》与数据出境规则</text>
  <text x="448.0" y="274.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">重要数据的识别、出境安全评估与标准合同</text>
  <rect x="24.0" y="316.0" width="400.0" height="66.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.16" stroke="#009E73" stroke-width="1.5"/>
  <text x="224.0" y="353.1" font-size="13.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">《个人信息保护法》</text>
  <text x="448.0" y="356.0" font-size="12" text-anchor="start" font-weight="400" fill="#444">患者个人信息的告知同意、最小必要与单独同意</text>
  <text x="24.0" y="410.0" font-size="12.5" text-anchor="start" font-weight="700" fill="#444">四层相互独立：满足其中一层不构成对其他层的豁免。</text>
</svg>