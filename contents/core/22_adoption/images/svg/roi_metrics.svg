  </defs>
  <rect width="1020" height="460" fill="#ffffff"/>
  <text x="510.0" y="28.0" font-size="15.5" text-anchor="middle" font-weight="700" fill="#1a1a1a">度量投资回报：三类指标，可信度递减</text>
  <rect x="20.0" y="66.0" width="212.0" height="98.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.17" stroke="#0072B2" stroke-width="1.5"/>
  <text x="126.0" y="119.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">过程指标</text>
  <text x="254.0" y="98.0" font-size="12" text-anchor="start" font-weight="400" fill="#1a1a1a">预测通量、周期时长、数据入库延迟、模型再训练频率</text>
  <text x="254.0" y="144.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">可直接观测，但与价值的关系最弱</text>
  <rect x="790.0" y="90.0" width="210.0" height="50.0" rx="6" ry="6" fill="#0072B2" fill-opacity="0.2" stroke="#0072B2" stroke-width="1.5"/>
  <text x="895.0" y="118.5" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">可信度高 / 价值关联弱</text>
  <rect x="20.0" y="182.0" width="212.0" height="98.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.17" stroke="#009E73" stroke-width="1.5"/>
  <text x="126.0" y="235.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">决策指标</text>
  <text x="254.0" y="214.0" font-size="12" text-anchor="start" font-weight="400" fill="#1a1a1a">进入下一阶段的候选数、被终止项目的平均用时、</text>
  <text x="254.0" y="236.0" font-size="12" text-anchor="start" font-weight="400" fill="#1a1a1a">化学家采纳预测的比例</text>
  <text x="254.0" y="260.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">最有意义的一层，需要事先约定记录方式</text>
  <rect x="790.0" y="206.0" width="210.0" height="50.0" rx="6" ry="6" fill="#009E73" fill-opacity="0.2" stroke="#009E73" stroke-width="1.5"/>
  <text x="895.0" y="234.5" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">可信度中 / 价值关联强</text>
  <rect x="20.0" y="298.0" width="212.0" height="98.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.17" stroke="#E69F00" stroke-width="1.5"/>
  <text x="126.0" y="351.2" font-size="14" text-anchor="middle" font-weight="600" fill="#1a1a1a">结果指标</text>
  <text x="254.0" y="330.0" font-size="12" text-anchor="start" font-weight="400" fill="#1a1a1a">先导优化轮次、候选化合物提名时间、临床成功率</text>
  <text x="254.0" y="376.0" font-size="11.5" text-anchor="start" font-weight="400" fill="#555">周期长、混杂因素多，单个项目无法归因</text>
  <rect x="790.0" y="322.0" width="210.0" height="50.0" rx="6" ry="6" fill="#E69F00" fill-opacity="0.2" stroke="#E69F00" stroke-width="1.5"/>
  <text x="895.0" y="350.4" font-size="11.5" text-anchor="middle" font-weight="600" fill="#1a1a1a">可信度低 / 价值关联最强</text>
  <rect x="20.0" y="420.0" width="980.0" height="32.0" rx="5" ry="5" fill="#A51C30" fill-opacity="0.1" stroke="#A51C30" stroke-width="1.5"/>
  <text x="510.0" y="441.0" font-size="12" text-anchor="middle" font-weight="700" fill="#A51C30">“AI 节省了 N 个月”这类说法几乎总是结果指标的单项目归因——不可验证</text>
</svg>